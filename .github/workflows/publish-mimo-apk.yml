name: Publish MiMo TTS APK download

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build MiMo TTS APK run ID
        required: true
        type: string
  workflow_run:
    workflows: ['Build MiMo TTS APK']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-mimo-apk
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      APK_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    steps:
      - name: Verify source build and download APK
        run: |
          set -euo pipefail
          [[ "$APK_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_RUN_ID" > source-run.json
          python - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['name'] == 'Build MiMo TTS APK'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('APK_COMMIT=' + run['head_sha'] + '\n')
          PY
          gh run download "$APK_RUN_ID" --repo "$GITHUB_REPOSITORY" --name readest-mimo-tts-arm64 --dir apk
          cd apk
          sha256sum --check SHA256SUMS
          test -s Readest-MiMo-TTS-arm64.apk

      - name: Publish verified APK as a prerelease
        run: |
          set -euo pipefail
          tag="mimo-tts-optimized-${APK_COMMIT:0:7}"
          cat > release-notes.md <<'NOTES'
          MiMo TTS optimized ARM64 test APK for Android 8.0 or later.
          Release 构建，已移除调试符号，保留阅读和 MiMo 朗读功能。

          安装后在“设置 → 朗读 → MiMo TTS”输入自己的 API Key。
          使用固定的公开测试签名，与官方版及先前的临时签名测试版不同。提示签名不一致时，请先备份书籍、批注和设置，再卸载旧版安装。
          小米 15 的 ARM64 架构满足要求，但尚未进行小米 15 真机测试。
          NOTES
          printf '\nSource commit: %s\nBuild run: %s\n' "$APK_COMMIT" "$APK_RUN_ID" >> release-notes.md
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$APK_COMMIT" --draft --prerelease --latest=false --title 'Readest MiMo TTS — optimized ARM64 test APK' --notes-file release-notes.md
          fi
          gh release upload "$tag" apk/Readest-MiMo-TTS-arm64.apk apk/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false --notes-file release-notes.md
